<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Serrano</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--azul:#1E3A5F;--nogal:#8C6A49;--piedra:#F5F5F5;--crema:#FFF8E1;--txt2:#4A6572;--o:cubic-bezier(.23,1,.32,1);box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--piedra);color:var(--azul);font:400 16px/1.55 "Hanken Grotesk",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2{font-family:"Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--azul);color:var(--crema)}
header b{font:700 1.25rem "Bricolage Grotesque",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 5vw 60px}
.box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 0 0 1px rgba(30,58,95,.1);margin-bottom:26px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input,select,textarea{font:inherit;padding:13px;border:1px solid #c9d1d6;border-radius:10px;background:#fff;color:var(--azul);width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--nogal);box-shadow:0 0 0 3px rgba(140,106,73,.18)}
button{font:600 .95rem "Hanken Grotesk",sans-serif;background:var(--azul);color:#fff;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;transition:transform .16s var(--o),background-color .2s}
button:active{transform:scale(.97)}button:disabled{opacity:.55}
@media(hover:hover){button:hover:not(:disabled){background:var(--nogal)}}
header button{background:rgba(255,248,225,.16);padding:8px 16px}
#msg,#lm{margin:6px 0 0;font-size:.92rem;color:var(--nogal);min-height:1.4em}
.it{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-top:1px solid rgba(30,58,95,.12)}
.th{width:84px;height:84px;border-radius:10px;overflow:hidden;background:#eadfc6;display:grid;place-items:center;font-size:.8rem;color:var(--txt2)}
.th img{width:100%;height:100%;object-fit:cover}
.it small{display:block;color:var(--txt2)}
.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ac button{padding:8px 14px;font-size:.85rem;background:#e9eef2;color:var(--azul)}
.ac .rm{background:#fbe9e9;color:#a33}
@media(hover:hover){.ac button:hover:not(:disabled){background:var(--crema);color:var(--azul)}.ac .rm:hover:not(:disabled){background:#f4d3d3;color:#a33}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b>Serrano · Panel de trabajos</b><button id="out" hidden>Salir</button></header>
<main>
<section class="box" id="login">
 <h2 style="margin-bottom:14px">Acceso</h2>
 <form id="lf"><label>Correo<input id="em" type="email" required autocomplete="username"></label><label>Contraseña<input id="pw" type="password" required autocomplete="current-password"></label><button>Entrar</button></form>
 <p id="lm" role="status"></p>
</section>
<div id="app" hidden>
 <section class="box">
  <h2 style="margin-bottom:14px">Subir un trabajo nuevo</h2>
  <form id="nf">
   <label>Título<input id="ti" required maxlength="80" placeholder="Armario empotrado en Marchamalo"></label>
   <label>Categoría<select id="ca"></select></label>
   <label>Descripción (opcional)<textarea id="de" rows="2" maxlength="200"></textarea></label>
   <label>Trabajo terminado: fotos y vídeos<input id="fi" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple required></label>
   <label>Antes (opcional): fotos o vídeos del estado anterior<input id="fb2" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple></label>
   <button id="nb">Publicar trabajo</button>
  </form>
  <p id="msg" role="status"></p>
 </section>
 <section class="box"><h2>Trabajos publicados</h2><div id="list"></div></section>
</div>
</main>
<input type="file" id="addf" accept="image/*,video/*" multiple hidden>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var C=window.SERRANO_CFG||{},sb=supabase.createClient(C.url,C.key),B="trabajos",MAX=50*1024*1024,store=[],addTo=null;
var CATS=["Armarios y vestidores","Cocinas","Puertas","Ventanas","Baños","Tarimas y rodapiés","Ebanistería"];
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function say(t,err){$("msg").textContent=t;$("msg").style.color=err?"#a33":""}
$("ca").innerHTML=CATS.map(function(c){return"<option>"+c+"</option>"}).join("");
async function session(){var r=await sb.auth.getSession(),on=!!r.data.session;
 if(on){var ad=await sb.rpc("es_admin");if(ad.data!==true){$("lm").textContent="Esta cuenta no tiene permiso para gestionar trabajos.";await sb.auth.signOut();return}}
 $("login").hidden=on;$("app").hidden=!on;$("out").hidden=!on;if(on)list()}
$("lf").onsubmit=async function(e){e.preventDefault();$("lm").textContent="Entrando…";
 var r=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
 if(r.error)$("lm").textContent="Correo o contraseña incorrectos.";else{$("lm").textContent="";session()}};
$("out").onclick=async function(){await sb.auth.signOut();session()};
function kindOf(f){var t=f.type;if(t.indexOf("image/")===0)return"image";if(t==="video/mp4"||t==="video/webm"||t==="video/quicktime"||/\.(mp4|mov|webm)$/i.test(f.name))return"video";return null}
function toJpeg(f){return createImageBitmap(f).then(function(b){var k=Math.min(1,1920/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
 c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(function(ok,ko){c.toBlob(function(bl){bl?ok(bl):ko()},"image/jpeg",.82)})})}
async function putAll(files,phase){var ok=[],fail=0;
 for(var i=0;i<files.length;i++){var f=files[i],kind=kindOf(f);
  if(!kind||(kind==="video"&&f.size>MAX)){fail++;continue}
  say("Subiendo "+(phase==="before"?"(antes) ":"")+(i+1)+" de "+files.length+"…");
  var id=crypto.randomUUID(),w=/\.webm$/i.test(f.name)||f.type==="video/webm",ext=kind==="image"?"jpg":(w?"webm":"mp4"),ct=kind==="image"?"image/jpeg":(w?"video/webm":"video/mp4"),blob=f;
  try{if(kind==="image")blob=await toJpeg(f)}catch(e){fail++;continue}
  var u=await sb.storage.from(B).upload(id+"."+ext,blob,{contentType:ct,cacheControl:"31536000"});
  if(u.error){fail++;continue}
  ok.push({path:id+"."+ext,phase:phase,kind:kind})}
 return{ok:ok,fail:fail}}
function rm(items){return items.length?sb.storage.from(B).remove(items.map(function(x){return x.path})):Promise.resolve()}
$("nf").onsubmit=async function(e){e.preventDefault();var af=[].slice.call($("fi").files),bf=[].slice.call($("fb2").files);
 if(af.length+bf.length>20)return say("Máximo 20 archivos por trabajo.",1);
 $("nb").disabled=true;
 var a=await putAll(af,"after"),b=await putAll(bf,"before"),items=a.ok.concat(b.ok),fail=a.fail+b.fail;
 if(!a.ok.length){await rm(items);say("No se pudo subir ningún archivo del trabajo terminado. Usa JPG, PNG, WebP, MP4 o WebM (vídeos de hasta 50 MB).",1);$("nb").disabled=false;return}
 var r=await sb.from("trabajos").insert({title:$("ti").value.trim(),cat:$("ca").value,description:$("de").value.trim(),path:a.ok[0].path,kind:a.ok[0].kind,media:items});
 if(r.error){await rm(items);say("No se pudo guardar el trabajo.",1)}
 else{say("Trabajo publicado con "+items.length+" archivo(s)"+(fail?" · "+fail+" no se pudieron subir (formato no válido o más de 50 MB)":"")+".");e.target.reset()}
 $("nb").disabled=false;list()};
function allItems(p){var m=(p.media||[]).slice();if(!m.some(function(x){return x.path===p.path}))m.unshift({path:p.path,phase:"after",kind:p.kind});return m}
async function list(){var r=await sb.from("trabajos").select("*").order("created_at",{ascending:false});
 if(r.error){$("list").textContent="No se pudieron cargar los trabajos.";return}
 store=r.data;
 $("list").innerHTML=store.length?store.map(function(p){var m=allItems(p),c=m.filter(function(x){return x.kind==="image"})[0];
  var t=c?'<img src="'+sb.storage.from(B).getPublicUrl(c.path).data.publicUrl+'" alt="">':"Vídeo";
  return'<article class="it"><div class="th">'+t+'</div><div><b>'+esc(p.title)+'</b><small>'+esc(p.cat)+" · "+m.length+' archivos</small><div class="ac"><button data-a="add" data-id="'+p.id+'">Añadir archivos</button><button class="rm" data-a="del" data-id="'+p.id+'">Eliminar</button></div></div></article>'}).join(""):"<p>Aún no hay trabajos.</p>"}
$("list").onclick=async function(e){var b=e.target.closest("button");if(!b)return;var p=store.filter(function(x){return x.id===b.dataset.id})[0];if(!p)return;
 if(b.dataset.a==="add"){addTo=p;$("addf").click()}
 if(b.dataset.a==="del"&&confirm("¿Eliminar «"+p.title+"» y todos sus archivos?")){
  await rm(allItems(p));var d=await sb.from("trabajos").delete().eq("id",p.id);if(d.error)say("No se pudo eliminar.",1);list()}};
$("addf").onchange=async function(){var fl=[].slice.call(this.files);if(!fl.length||!addTo)return;var old=allItems(addTo);
 if(old.length+fl.length>20){say("Un trabajo admite 20 archivos como máximo.",1);this.value="";return}
 var u=await putAll(fl,"after");
 if(u.ok.length){var r=await sb.from("trabajos").update({media:old.concat(u.ok)}).eq("id",addTo.id);if(r.error){await rm(u.ok);say("No se pudieron añadir los archivos.",1)}else say(u.ok.length+" archivo(s) añadido(s)"+(u.fail?" · "+u.fail+" no válidos":"")+".")}
 else say("No se pudo subir ningún archivo (formato no válido o más de 50 MB).",1);
 this.value="";list()};
sb.auth.onAuthStateChange(function(){session()});session();
</script>
</body>
</html>
